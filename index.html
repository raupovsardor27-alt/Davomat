<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Davomat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --fg: var(--tg-theme-text-color, #111111);
  --hint: var(--tg-theme-hint-color, #7a7a7a);
  --btn: var(--tg-theme-button-color, #2481cc);
  --btnfg: var(--tg-theme-button-text-color, #ffffff);
  --card: var(--tg-theme-secondary-bg-color, #f1f3f5);
  --ok: #2e9e5b; --bad: #d64545; --warn: #d98a00;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body { padding: 14px 14px calc(78px + env(safe-area-inset-bottom, 0px)); }
h1 { font-size: 20px; margin: 4px 0 12px; }
h2 { font-size: 16px; margin: 18px 0 8px; }
.card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.muted { color: var(--hint); font-size: 14px; }
.big { font-size: 26px; font-weight: 700; }
.ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
button, select, input { font: inherit; }
.punch { width: 100%; height: 76px; border: 0; border-radius: 18px; font-size: 22px; font-weight: 700;
  background: var(--btn); color: var(--btnfg); margin: 6px 0 10px; }
.punch:disabled { opacity: .55; }
.btn { border: 0; border-radius: 12px; padding: 12px 14px; background: var(--btn); color: var(--btnfg); font-weight: 600; width: 100%; margin-top: 8px; }
.btn.alt { background: var(--card); color: var(--fg); }
.btn:disabled { opacity: .55; }
.msg { min-height: 22px; font-weight: 600; margin: 4px 0 8px; white-space: pre-line; }
.row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(127,127,127,.2); }
.row:last-child { border-bottom: 0; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.stat { background: var(--card); border-radius: 14px; padding: 12px; }
.stat b { display: block; font-size: 26px; }
details { background: var(--card); border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; }
summary { font-weight: 600; }
ul { margin: 8px 0 2px; padding-left: 18px; } li { margin: 3px 0; }
input[type=text], input[type=search], input[type=date], input[type=time], select {
  width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid rgba(127,127,127,.35);
  background: var(--bg); color: var(--fg); margin: 4px 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
label { font-size: 13px; color: var(--hint); display: block; margin-top: 6px; }
.person { cursor: pointer; }
.tag { font-size: 12px; background: var(--btn); color: var(--btnfg); border-radius: 8px; padding: 1px 7px; margin-left: 6px; }
nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
  background: var(--bg); border-top: 1px solid rgba(127,127,127,.25); }
nav button { flex: 1; border: 0; border-radius: 12px; padding: 12px 6px; background: var(--card); color: var(--fg); font-weight: 600; }
nav button.on { background: var(--btn); color: var(--btnfg); }
.back { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 5; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow: auto; z-index: 6; background: var(--bg);
  border-radius: 20px 20px 0 0; padding: 16px 14px calc(20px + env(safe-area-inset-bottom, 0px)); }
#toast { position: fixed; left: 14px; right: 14px; top: 12px; z-index: 9; padding: 12px 14px; border-radius: 12px; color: #fff;
  font-weight: 600; white-space: pre-line; display: none; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="loading" class="muted">Yuklanmoqda…</div>

<section id="tab-me" hidden>
  <h1 id="meName"></h1>
  <div class="card">
    <div class="muted">Bugun</div>
    <div id="meState" class="big"></div>
    <div id="meDetail" class="muted"></div>
  </div>
  <button id="punchBtn" class="punch">📍 KELDIM / KETDIM</button>
  <div id="punchMsg" class="msg"></div>
  <h2>Oxirgi kunlar</h2>
  <div id="history" class="card"></div>
</section>

<section id="tab-rep" hidden>
  <h1>Hisobot <span id="repDate" class="muted"></span></h1>
  <div id="repBody"></div>
  <button id="repRefresh" class="btn alt">🔄 Yangilash</button>
</section>

<section id="tab-kadr" hidden>
  <h1>Kadr paneli</h1>
  <input type="search" id="q" placeholder="Ism bo'yicha qidirish">
  <select id="kodFilter"></select>
  <div id="staffList" class="card" style="margin-top:10px"></div>
</section>

<nav id="nav" hidden></nav>
<div id="back" class="back" hidden></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast"></div>

<script>
(function () {
"use strict";

// >>> Apps Script "Web app" havolasini shu yerga qo'ying (/exec bilan tugaydi) <<<
const API_URL = "BU_YERGA_APPS_SCRIPT_WEB_APP_URL";

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const $ = function (id) { return document.getElementById(id); };
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function todayStr() {
  try { return new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Tashkent" }); }
  catch (e) { return new Date().toISOString().slice(0, 10); }
}
function haptic(ok) {
  try { tg.HapticFeedback.notificationOccurred(ok ? "success" : "error"); } catch (e) {}
}

let ME = null, STAFF = null, CURRENT = "";
let toastTimer = null;
function toast(text, ok) {
  const t = $("toast");
  t.textContent = text;
  t.style.background = ok ? "var(--ok)" : "var(--bad)";
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = "none"; }, 4500);
  haptic(ok);
}

async function api(action, data) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },   // preflight talab qilinmasligi uchun
    body: JSON.stringify(Object.assign({ initData: tg ? tg.initData : "", action: action }, data || {}))
  });
  if (!res.ok) throw new Error("Server javob bermadi");
  return res.json();
}

function fatal(text) {
  $("loading").hidden = false;
  $("loading").innerHTML = '<div class="card">' + esc(text) + "</div>";
}

// ---------------- Boshlash ----------------
async function boot() {
  if (!tg || !tg.initData) return fatal("Bu sahifa Telegram ichida, bot orqali ochiladi.");
  if (API_URL.indexOf("BU_YERGA") === 0) return fatal("API_URL kiritilmagan (index.html boshida).");
  try { ME = await api("me"); }
  catch (e) { return fatal("Serverga ulanib bo'lmadi. Internetni tekshirib, qayta oching."); }
  if (ME.err === "auth") return fatal("Kirish tasdiqlanmadi. Ilovani bot ichidan qayta oching.");

  const tabs = [];
  if (ME.isStaff) tabs.push(["me", "Men"]);
  if (ME.isAdmin) tabs.push(["rep", "Hisobot"]);
  if (ME.isKadr) tabs.push(["kadr", "Kadr"]);
  if (!tabs.length) return fatal("Siz ro'yxatdan o'tmagansiz. Botga o'tib /start bosing va raqamingizni yuboring.");

  $("loading").hidden = true;
  const nav = $("nav");
  nav.innerHTML = "";
  tabs.forEach(function (t) {
    const b = document.createElement("button");
    b.textContent = t[1];
    b.dataset.tab = t[0];
    b.addEventListener("click", function () { go(t[0]); });
    nav.appendChild(b);
  });
  nav.hidden = tabs.length < 2;
  go(tabs[0][0]);
}

function go(name) {
  CURRENT = name;
  ["me", "rep", "kadr"].forEach(function (n) { $("tab-" + n).hidden = n !== name; });
  Array.prototype.forEach.call($("nav").children, function (b) { b.classList.toggle("on", b.dataset.tab === name); });
  if (name === "me") renderMe();
  if (name === "rep") loadRep();
  if (name === "kadr") loadKadr();
}

// ---------------- Xodim: "Men" ----------------
function getLoc() {
  return new Promise(function (resolve, reject) {
    function fallback() {
      if (!navigator.geolocation) return reject(new Error("Bu qurilmada joylashuv aniqlanmaydi."));
      navigator.geolocation.getCurrentPosition(
        function (p) { resolve({ lat: p.coords.latitude, lng: p.coords.longitude }); },
        function () { reject(new Error("Joylashuvga ruxsat bering (Telegram sozlamalarida).")); },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }
    const lm = tg && tg.LocationManager;
    if (lm && lm.init) {
      lm.init(function () {
        if (!lm.isLocationAvailable) return fallback();
        lm.getLocation(function (loc) {
          if (loc) resolve({ lat: loc.latitude, lng: loc.longitude });
          else fallback();
        });
      });
    } else fallback();
  });
}

function renderMe() {
  $("meName").textContent = ME.name;
  const t = ME.today;
  let state = "Hali belgilanmagan", cls = "muted", detail = "";
  if (t) {
    if (!t.in) { state = t.holat; cls = "warn"; }
    else if (t.out) { state = "Ketdi " + t.out; cls = "ok"; detail = "Keldi " + t.in + " · " + t.holat; }
    else { state = "Keldi " + t.in; cls = "ok"; detail = t.holat; }
  }
  const s = $("meState");
  s.textContent = state;
  s.className = "big " + cls;
  $("meDetail").textContent = detail;

  const b = $("punchBtn");
  const away = t && !t.in;
  b.disabled = !ME.punchEnabled || !!away;
  b.hidden = false;
  if (!ME.punchEnabled) $("punchMsg").textContent = "Belgilash uchun botdagi 📍 tugmadan foydalaning.";

  const h = $("history");
  if (!ME.history || !ME.history.length) h.innerHTML = '<div class="muted">Hozircha yozuv yo\'q.</div>';
  else h.innerHTML = ME.history.map(function (x) {
    const mid = x.in ? esc(x.in) + (x.out ? " – " + esc(x.out) : " – …") : "";
    return '<div class="row"><span>' + esc(x.date.slice(8) + "." + x.date.slice(5, 7)) + "</span><span>" + mid +
           '</span><span class="muted">' + esc(x.holat) + "</span></div>";
  }).join("");
}

async function punch() {
  const b = $("punchBtn"), msg = $("punchMsg");
  b.disabled = true;
  msg.className = "msg"; msg.textContent = "";
  const old = b.textContent;
  try {
    b.textContent = "Joylashuv aniqlanmoqda…";
    const loc = await getLoc();
    b.textContent = "Yuborilmoqda…";
    const r = await api("punch", { lat: loc.lat, lng: loc.lng });
    msg.textContent = r.msg || r.err || "Xatolik";
    msg.className = "msg " + (r.ok ? "ok" : "bad");
    haptic(!!r.ok);
    if (r.today !== undefined) ME.today = r.today;
    if (r.history) ME.history = r.history;
  } catch (e) {
    msg.textContent = e.message || "Xatolik";
    msg.className = "msg bad";
    haptic(false);
  }
  b.textContent = old;
  renderMe();
}

// ---------------- Rahbar / kadr: "Hisobot" ----------------
function sec(title, items, open) {
  if (!items.length) return "";
  return "<details" + (open ? " open" : "") + "><summary>" + esc(title) + " (" + items.length + ")</summary><ul>" +
    items.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></details>";
}
async function loadRep() {
  $("repBody").innerHTML = '<div class="muted">Yuklanmoqda…</div>';
  try {
    const r = await api("report");
    if (!r.ok) throw new Error("Ruxsat yo'q");
    const d = r.data;
    $("repDate").textContent = d.date;
    $("repBody").innerHTML =
      '<div class="grid">' +
      '<div class="stat"><span class="muted">Kelgan</span><b class="ok">' + d.came.length + "</b></div>" +
      '<div class="stat"><span class="muted">Kechikkan</span><b class="warn">' + d.late.length + "</b></div>" +
      '<div class="stat"><span class="muted">Kelmagan</span><b class="bad">' + d.absent.length + "</b></div>" +
      '<div class="stat"><span class="muted">Ta\'til/kasal/safar</span><b>' + d.away.length + "</b></div></div>" +
      sec("⏰ Kechikkanlar", d.late.map(function (x) { return x.name + " — " + x.at; }), true) +
      sec("❌ Kelmaganlar", d.absent, true) +
      sec("🏖 Ta'til/kasal/safarda", d.away.map(function (x) { return x.name + " — " + x.holat; }), false) +
      sec("🚪 Erta ketganlar", d.early.map(function (x) { return x.name + " — " + x.at; }), false) +
      sec("👀 Tekshiruvga javob bermaganlar", d.miss.map(function (x) { return x.name + " — " + x.at; }), false) +
      sec("📋 Botda yo'q (qog'ozda tekshiring)", d.noBot, false) +
      '<div class="muted" style="margin:6px 0 12px">Ketishni belgilamagan: ' + d.still + " · Rad etilgan urinishlar: " + d.bad + "</div>";
  } catch (e) {
    $("repBody").innerHTML = '<div class="card bad">' + esc(e.message || "Xatolik") + "</div>";
  }
}

// ---------------- Kadr paneli ----------------
async function loadKadr() {
  if (!STAFF) $("staffList").innerHTML = '<div class="muted">Yuklanmoqda…</div>';
  try {
    const r = await api("staff");
    if (!r.ok) throw new Error("Ruxsat yo'q");
    STAFF = r;
    const sel = $("kodFilter"), cur = sel.value;
    sel.innerHTML = '<option value="">Hamma toifalar</option>' +
      r.cats.map(function (c) { return '<option value="' + esc(c.kod) + '">' + esc(c.kod + " — " + c.name) + "</option>"; }).join("");
    sel.value = cur;
    renderStaff();
  } catch (e) {
    $("staffList").innerHTML = '<div class="bad">' + esc(e.message || "Xatolik") + "</div>";
  }
}
function renderStaff() {
  if (!STAFF) return;
  const q = $("q").value.trim().toLowerCase(), kf = $("kodFilter").value;
  const rows = [];
  STAFF.staff.forEach(function (p, i) {
    if (q && p.name.toLowerCase().indexOf(q) < 0) return;
    if (kf && p.kod !== kf) return;
    const cls = p.state.indexOf("keldi") === 0 ? "ok" : p.state === "kelmagan" ? "bad" : "warn";
    rows.push('<div class="row person" data-i="' + i + '"><span>' + esc(p.name) +
      (p.kod ? '<span class="tag">' + esc(p.kod) + "</span>" : "") +
      (p.reg ? "" : ' <span class="muted">(botda yo\'q)</span>') +
      '</span><span class="' + cls + '">' + esc(p.state) + "</span></div>");
  });
  $("staffList").innerHTML = rows.length ? rows.join("") : '<div class="muted">Hech kim topilmadi.</div>';
}

function closeSheet() { $("sheet").hidden = true; $("back").hidden = true; }

function openSheet(p) {
  const kodOpts = '<option value="">— yo\'q —</option>' + STAFF.cats.map(function (c) {
    return '<option value="' + esc(c.kod) + '"' + (c.kod === p.kod ? " selected" : "") + ">" + esc(c.kod + " — " + c.name) + "</option>";
  }).join("");
  $("sheet").innerHTML =
    "<h1>" + esc(p.name) + '</h1><div class="muted">Bugun: ' + esc(p.state) + " · umumiy qoida bo'yicha kelish " + esc(p.late) + ", ketish " + esc(p.leave) + "</div>" +

    "<h2>Vaqtni tuzatish</h2>" +
    '<label>Sana</label><input type="date" id="fDate" value="' + todayStr() + '">' +
    '<div class="two"><div><label>Keldi</label><input type="time" id="fIn"></div><div><label>Ketdi</label><input type="time" id="fOut"></div></div>' +
    '<button class="btn" id="btnTuzat">Tuzatish</button>' +

    "<h2>Ta'til / kasal / safar</h2>" +
    '<select id="bCode"><option value="T">Ta\'til</option><option value="K">Kasal (varaqa)</option>' +
    '<option value="X">Xizmat safari</option><option value="M">Malaka oshirish</option><option value="0">Belgini o\'chirish</option></select>' +
    '<div class="two"><div><label>Dan</label><input type="date" id="bFrom" value="' + todayStr() + '"></div>' +
    '<div><label>Gacha (ixtiyoriy)</label><input type="date" id="bTo"></div></div>' +
    '<button class="btn" id="btnBelgi">Belgilash</button>' +

    "<h2>Shaxsiy vaqt va toifa</h2>" +
    '<div class="two"><div><label>Kelish chegarasi</label><input type="time" id="vLate" value="' + esc(p.ownLate) + '"></div>' +
    '<div><label>Ketish vaqti</label><input type="time" id="vLeave" value="' + esc(p.ownLeave) + '"></div></div>' +
    '<label>Toifa kodi</label><select id="vKod">' + kodOpts + "</select>" +
    '<div class="muted" style="margin-top:6px">Bo\'sh vaqt = toifa yoki umumiy qoida ishlaydi.</div>' +
    '<button class="btn" id="btnVaqt">Saqlash</button>' +
    '<button class="btn alt" id="btnClose">Yopish</button>';

  async function run(btn, fn) {
    btn.disabled = true;
    try {
      const r = await fn();
      toast(r.msg || r.err || "Xatolik", !!r.ok);
      if (r.ok) { closeSheet(); await loadKadr(); }
    } catch (e) { toast(e.message || "Xatolik", false); }
    btn.disabled = false;
  }
  $("btnTuzat").onclick = function () {
    run(this, function () { return api("tuzat", { name: p.name, date: $("fDate").value, in: $("fIn").value || "-", out: $("fOut").value || "-" }); });
  };
  $("btnBelgi").onclick = function () {
    const a = $("bFrom").value, b = $("bTo").value;
    if (!a) return toast("Sanani tanlang.", false);
    run(this, function () { return api("belgi", { name: p.name, date: b ? a + ".." + b : a, code: $("bCode").value }); });
  };
  $("btnVaqt").onclick = function () {
    run(this, async function () {
      const r1 = await api("vaqt", { name: p.name, late: $("vLate").value, leave: $("vLeave").value });
      if (!r1.ok) return r1;
      return api("kod", { name: p.name, kod: $("vKod").value || "-" });
    });
  };
  $("btnClose").onclick = closeSheet;
  $("back").hidden = false;
  $("sheet").hidden = false;
}

// ---------------- Hodisalar ----------------
$("punchBtn").addEventListener("click", punch);
$("repRefresh").addEventListener("click", loadRep);
$("q").addEventListener("input", renderStaff);
$("kodFilter").addEventListener("change", renderStaff);
$("back").addEventListener("click", closeSheet);
$("staffList").addEventListener("click", function (e) {
  let el = e.target;
  while (el && !(el.dataset && el.dataset.i !== undefined)) el = el.parentNode;
  if (el && STAFF) openSheet(STAFF.staff[Number(el.dataset.i)]);
});

boot();
})();
</script>
</body>
</html>
